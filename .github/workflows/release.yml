# Releases are fully automated:
#
# 1. Every push to main lets release-please update a "chore: release x.y.z" pull request,
#    with the version bump and CHANGELOG computed from Conventional Commits.
# 2. Merging that pull request creates the git tag and GitHub release.
# 3. The publish job then runs every quality gate and publishes to npm through
#    npm trusted publishing (OIDC): no npm token is stored anywhere, and npm attaches
#    a provenance attestation that links the package to this exact workflow run.
#
# One-time setup: see "Releasing" in CONTRIBUTING.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ms1design/opencode-systemone-plugin
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: All quality gates
        run: bun run check

      - name: Publish
        run: npm publish --access public
